<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>FacultyPerformance · 연구 실적 대시보드</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">FP</span> FacultyPerformance</div>
      <p id="edition">암호화된 연구 실적 대시보드</p>
      <button id="lock" type="button" hidden>닫기</button>
    </div>
  </header>
  <main>
    <section id="gate" class="gate" aria-labelledby="gate-title">
      <p class="eyebrow">FacultyPerformance</p>
      <h1 id="gate-title">연구 실적 대시보드</h1>
      <p>공유받은 링크를 열면 브라우저에서 데이터를 복호화해 대시보드를 표시합니다.</p>
      <form id="unlock-form">
        <label for="share-key">열람 링크 또는 열람 키</label>
        <div class="unlock-row">
          <input id="share-key" type="password" autocomplete="off" spellcheck="false" required>
          <button class="primary" type="submit">열기</button>
        </div>
        <details>
          <summary>로컬 스냅샷 파일 열기</summary>
          <label for="snapshot-file">암호화 스냅샷 파일</label>
          <input id="snapshot-file" type="file" accept=".snapshot">
          <p class="muted">선택한 파일은 이 브라우저에서만 읽습니다.</p>
        </details>
      </form>
      <p id="gate-status" role="status" aria-live="polite"></p>
    </section>
    <section id="dashboard" hidden></section>
  </main>
  <footer>FacultyPerformance <span>·</span> Developed by Wook-Shin Han</footer>
</body>
</html>
